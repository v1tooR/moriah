<style>
@import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Libre+Caslon+Display&display=swap');

/* ── Tokens Moriah (auto-suficiente) ────────────────────────── */
:root {
  --m-font-body:    'Jost', system-ui, sans-serif;
  --m-font-display: 'Libre Caslon Display', 'Times New Roman', serif;
  --m-espresso:     #2A2320;
  --m-ink-1:        #2A2320;
  --m-ink-3:        #8A7E72;
  --m-marrom:       #7A5C4F;
  --m-nude-30:      #EAE3D9;
  --m-container:    1180px;
  --m-gutter:       clamp(20px, 5vw, 64px);
  --m-r-pill:       999px;
  --m-r-md:         10px;
  --m-fs-eyebrow:   0.75rem;
  --m-hairline-bronze: 1px solid rgba(169,138,82,.45);
  --m-ease:         cubic-bezier(.2,.7,.2,1);
  --m-dur:          360ms;
  --m-dur-fast:     200ms;
}

/* ── NAV ────────────────────────────────────────────────────── */
.lp-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  transition: background var(--m-dur) var(--m-ease), box-shadow var(--m-dur) var(--m-ease);
}
.lp-nav .row {
  max-width: var(--m-container); margin: 0 auto;
  padding: 18px var(--m-gutter);
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.lp-nav .brand {
  display: flex; align-items: center; gap: 14px; text-decoration: none; flex: none;
}
.lp-nav .brand-logo { height: 26px; width: auto; color: var(--m-espresso); }
.lp-nav nav { display: flex; gap: 2px; }
.lp-nav nav a {
  font-family: var(--m-font-body);
  font-size: var(--m-fs-eyebrow); letter-spacing: .10em; text-transform: uppercase;
  color: var(--m-ink-3); padding: 9px 14px; border-radius: var(--m-r-pill);
  transition: color var(--m-dur-fast), background var(--m-dur-fast);
  text-decoration: none;
}
.lp-nav nav a:hover { color: var(--m-ink-1); background: var(--m-nude-30); }
.lp-nav .nav-cta {
  font-family: var(--m-font-body); font-size: var(--m-fs-eyebrow); font-weight: 500;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--m-marrom); padding: 10px 20px; border-radius: var(--m-r-pill);
  border: var(--m-hairline-bronze); transition: all var(--m-dur-fast); text-decoration: none;
  white-space: nowrap;
}
.lp-nav .nav-cta:hover { background: var(--m-nude-30); }
.lp-nav.scrolled {
  background: rgba(245,245,239,.92); backdrop-filter: blur(16px);
  box-shadow: 0 1px 0 rgba(42,35,32,.08);
}

/* ── Hamburger ──────────────────────────────────────────────── */
.nav-toggle {
  display: none;
  flex-direction: column; justify-content: center; align-items: center;
  gap: 5px; width: 40px; height: 40px;
  background: none; border: none; cursor: pointer; padding: 8px;
  border-radius: var(--m-r-md);
  transition: background var(--m-dur-fast);
}
.nav-toggle:hover { background: var(--m-nude-30); }
.nav-toggle span {
  display: block; width: 20px; height: 1.5px;
  background: var(--m-espresso); border-radius: 2px;
  transition: transform var(--m-dur) var(--m-ease), opacity var(--m-dur) var(--m-ease), width var(--m-dur) var(--m-ease);
  transform-origin: center;
}
.nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; width: 0; }
.nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

/* ── Mobile drawer ──────────────────────────────────────────── */
.nav-mobile {
  position: fixed; inset: 0; z-index: 99;
  background: rgba(245,245,239,.97); backdrop-filter: blur(24px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px;
  opacity: 0; pointer-events: none;
  transition: opacity var(--m-dur) var(--m-ease);
}
.nav-mobile.open { opacity: 1; pointer-events: auto; }
.nav-mobile a {
  font-family: var(--m-font-display); font-size: clamp(1.6rem, 5vw, 2.2rem);
  font-weight: 300; color: var(--m-ink-1); text-decoration: none;
  padding: 12px 32px; border-radius: var(--m-r-pill);
  opacity: 0; transform: translateY(10px);
  transition: opacity var(--m-dur) var(--m-ease), transform var(--m-dur) var(--m-ease),
              color var(--m-dur-fast), background var(--m-dur-fast);
  letter-spacing: .01em;
}
.nav-mobile a:hover { color: var(--m-marrom); background: var(--m-nude-30); }
.nav-mobile.open a { opacity: 1; transform: translateY(0); }
.nav-mobile.open a:nth-child(1) { transition-delay: .05s; }
.nav-mobile.open a:nth-child(2) { transition-delay: .10s; }
.nav-mobile.open a:nth-child(3) { transition-delay: .15s; }
.nav-mobile.open a:nth-child(4) { transition-delay: .20s; }
.nav-mobile.open a:nth-child(5) { transition-delay: .25s; }
.nav-mobile.open a:nth-child(6) { transition-delay: .32s; }
.nav-mobile .nav-mobile-cta {
  font-family: var(--m-font-body); font-size: var(--m-fs-eyebrow); font-weight: 500;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--m-marrom); border: var(--m-hairline-bronze); margin-top: 16px;
}

/* ── Breakpoints ────────────────────────────────────────────── */
@media (max-width: 860px) {
  .lp-nav nav, .lp-nav .nav-cta { display: none; }
  .nav-toggle { display: flex; }
}
@media (prefers-reduced-motion: reduce) {
  .nav-mobile, .nav-mobile a, .nav-toggle span { transition: none; }
}
</style>

      <span></span><span></span><span></span>
    </button>

</header>

<!-- Mobile menu -->
<div class="nav-mobile" id="navMobile" role="dialog" aria-label="Menu de navegação">
  <a href="#tratamentos">Tratamentos</a>
  <a href="#sobre">A Clínica</a>
  <a href="#depoimentos">Resultados</a>
  <a href="#faq">Dúvidas</a>
  <a href="#contato">Contato</a>
  <a href="https://wa.me/5511915197330" class="nav-mobile-cta" target="_blank" rel="noopener">Avaliação Gratuita</a>
</div>

<script>
(function () {
  var nav    = document.getElementById('nav');
  var toggle = document.getElementById('navToggle');
  var drawer = document.getElementById('navMobile');

  window.addEventListener('scroll', function () {
    nav.classList.toggle('scrolled', window.scrollY > 40);
  }, { passive: true });

  function openMenu() {
    drawer.classList.add('open');
    toggle.setAttribute('aria-expanded', 'true');
    toggle.setAttribute('aria-label', 'Fechar menu');
    document.body.style.overflow = 'hidden';
  }
  function closeMenu() {
    drawer.classList.remove('open');
    toggle.setAttribute('aria-expanded', 'false');
    toggle.setAttribute('aria-label', 'Abrir menu');
    document.body.style.overflow = '';
  }

  toggle.addEventListener('click', function () {
    drawer.classList.contains('open') ? closeMenu() : openMenu();
  });

  drawer.querySelectorAll('a').forEach(function (link) {
    link.addEventListener('click', closeMenu);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeMenu();
  });
})();
</script>
